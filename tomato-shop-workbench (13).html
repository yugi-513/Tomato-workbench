<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F6F3EC'/%3E%3Cpath d='M50 30 Q41 17 27 22 Q36 29 41 34 Z' fill='%234F6B3C'/%3E%3Cpath d='M50 30 Q59 17 73 22 Q64 29 59 34 Z' fill='%234F6B3C'/%3E%3Cpath d='M50 20 Q45 28 50 35 Q55 28 50 20 Z' fill='%235E8064'/%3E%3Ccircle cx='50' cy='60' r='31' fill='%23B23A2E'/%3E%3Cpath d='M50 60 m-31 0 a31 31 0 0 1 62 0' fill='%23000000' opacity='0.06'/%3E%3Cellipse cx='39' cy='50' rx='7' ry='5' fill='%23D2604F' opacity='0.55'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F6F3EC'/%3E%3Cpath d='M50 30 Q41 17 27 22 Q36 29 41 34 Z' fill='%234F6B3C'/%3E%3Cpath d='M50 30 Q59 17 73 22 Q64 29 59 34 Z' fill='%234F6B3C'/%3E%3Cpath d='M50 20 Q45 28 50 35 Q55 28 50 20 Z' fill='%235E8064'/%3E%3Ccircle cx='50' cy='60' r='31' fill='%23B23A2E'/%3E%3Cpath d='M50 60 m-31 0 a31 31 0 0 1 62 0' fill='%23000000' opacity='0.06'/%3E%3Cellipse cx='39' cy='50' rx='7' ry='5' fill='%23D2604F' opacity='0.55'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="番茄工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B23A2E">
<style>
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --ink:#2B2823;
    --ink-soft:#8A8477;
    --line:#E4DFD3;

    --order:#B23A2E;
    --order-soft:#F7E3DE;
    --purchase:#4F6B3C;
    --purchase-soft:#E9EFE0;

    --overdue:#B4400C;
    --overdue-soft:#FBEAE3;
    --soon:#9A6B08;
    --soon-soft:#FBF1D8;
    --done:#5E8064;
    --done-soft:#EDF3EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:32px 24px 80px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-0.01em;margin:0;}
  .subtitle{color:var(--ink-soft);font-size:13px;margin:4px 0 0;}
  .add-group{display:flex;gap:8px;}
  .btn-add{
    border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;
    color:#fff;transition:opacity .15s;white-space:nowrap;
  }
  .btn-add:hover{opacity:.85;}
  .btn-add:active{transform:scale(0.98);}
  .btn-add.order{background:var(--order);}
  .btn-add.purchase{background:var(--purchase);}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat.warn .num{color:var(--overdue);}
  .stat.soon .num{color:var(--soon);}

  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:22px;display:none;
  }
  .panel.open{display:block;}
  .panel-title{font-size:14px;font-weight:600;margin:0 0 14px;color:var(--ink-soft);}
  .kind-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .kind-btn{
    flex:1;border:1.5px solid var(--line);background:#FCFBF8;border-radius:8px;
    padding:10px;text-align:center;font-size:14px;cursor:pointer;color:var(--ink-soft);
  }
  .kind-btn.active.order{border-color:var(--order);color:var(--order);background:var(--order-soft);}
  .kind-btn.active.purchase{border-color:var(--purchase);color:var(--purchase);background:var(--purchase-soft);}

  .pay-toggle{display:flex;gap:6px;height:100%;}
  .pay-btn{
    flex:1;border:1.5px solid var(--line);background:#FCFBF8;border-radius:7px;
    padding:9px 6px;text-align:center;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .pay-btn.active.unpaid{border-color:var(--overdue);color:var(--overdue);background:var(--overdue-soft);}
  .pay-btn.active.paid{border-color:var(--done);color:var(--done);background:var(--done-soft);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--ink-soft);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:7px;padding:9px 10px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#FCFBF8;
    outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:44px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .btn-secondary{background:none;border:1px solid var(--line);border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .btn-primary{background:var(--ink);color:#FBF9F4;border:none;border-radius:7px;padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;}
  .btn-primary:hover{opacity:.9;}

  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line);background:var(--surface);border-radius:20px;
    padding:6px 14px;font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  .chip.active{background:var(--ink);color:#FBF9F4;border-color:var(--ink);}

  .list{display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;display:flex;align-items:flex-start;gap:14px;
    border-left:4px solid var(--line);
  }
  .card.overdue{border-left-color:var(--overdue);}
  .card.soon{border-left-color:var(--soon);}
  .card.done{border-left-color:var(--done);opacity:.6;}
  .card .chk{
    width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
    flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;background:#fff;margin-top:2px;
  }
  .card.done .chk{background:var(--done);border-color:var(--done);}
  .card-main{flex:1;min-width:0;}
  .card-tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .card-party{font-size:12px;color:var(--ink-soft);}
  .pay-badge{
    font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;cursor:pointer;
    white-space:nowrap;letter-spacing:.02em;border:1px solid transparent;
  }
  .pay-badge.unpaid{background:var(--overdue-soft);color:var(--overdue);}
  .pay-badge.paid{background:var(--done-soft);color:var(--done);}
  .pay-badge:hover{opacity:.8;}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-name{font-size:15px;font-weight:500;}
  .card.done .card-name{text-decoration:line-through;color:var(--ink-soft);}
  .card-items{display:flex;flex-direction:column;gap:3px;}
  .card-item-line{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:500;}
  .card-item-line .iname{flex:1;min-width:0;}
  .card-item-line .iqty{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;
    color:var(--ink-soft);white-space:nowrap;
  }
  .card.done .card-items{text-decoration:line-through;color:var(--ink-soft);}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;letter-spacing:.02em;white-space:nowrap;
  }
  .tag.order{background:var(--order-soft);color:var(--order);}
  .tag.purchase{background:var(--purchase-soft);color:var(--purchase);}
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;}
  .card-note{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .card-status{font-size:12px;font-weight:500;padding:3px 10px;border-radius:6px;white-space:nowrap;margin-top:2px;}
  .card-status.overdue{background:var(--overdue-soft);color:var(--overdue);}
  .card-status.soon{background:var(--soon-soft);color:var(--soon);}
  .card-status.normal{background:#F0ECE3;color:var(--ink-soft);}
  .card-status.done{background:var(--done-soft);color:var(--done);}
  .card-edit{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;
    padding:4px;line-height:1;margin-top:2px;
  }
  .card-edit:hover{color:var(--ink);}
  .card-del{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;
    padding:4px;line-height:1;margin-top:2px;
  }
  .card-del:hover{color:var(--overdue);}

  .priority{
    background:var(--overdue-soft);border:1px solid #E8C4AE;border-radius:12px;
    padding:16px 18px;margin-bottom:22px;
  }
  .priority.calm{background:var(--done-soft);border-color:#CBDBC0;}
  .priority-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .priority-head .dot{width:8px;height:8px;border-radius:50%;background:var(--overdue);flex-shrink:0;}
  .priority.calm .priority-head .dot{background:var(--done);}
  .priority-head .txt{font-size:14px;font-weight:600;color:var(--ink);}
  .priority-item{
    display:flex;align-items:center;gap:10px;padding:8px 0;
    border-top:1px solid rgba(0,0,0,0.06);
  }
  .priority-item:first-of-type{border-top:none;}
  .priority-item .p-chk{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-soft);
    flex-shrink:0;cursor:pointer;background:#fff;
  }
  .priority-item .p-name{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .priority-item .p-when{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;white-space:nowrap;}
  .priority-item .p-when.overdue{color:var(--overdue);}
  .priority-item .p-when.today{color:var(--overdue);}
  .priority-item .p-when.tomorrow{color:var(--soon);}
  .priority-calm-text{font-size:13px;color:var(--ink-soft);}

  .empty .big{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}

  .btn-logout{
    background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink-soft);
    padding:10px 14px;font-size:13px;cursor:pointer;
  }
  .btn-logout:hover{color:var(--ink);}

  .login-screen{
    position:fixed;inset:0;background:var(--bg);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-box{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:32px 28px;max-width:360px;width:100%;
  }
  .login-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0 0 4px;text-align:center;}
  .login-sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;text-align:center;}
  .login-box .field{margin-bottom:14px;}
  .login-error{color:var(--overdue);font-size:12.5px;min-height:16px;margin:0 0 6px;text-align:center;}
  .login-btn{width:100%;padding:11px;font-size:14px;margin-top:4px;}

  .item-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .item-row{display:grid;grid-template-columns:1fr 72px 64px 28px;gap:6px;align-items:center;}
  .item-row input{
    border:1px solid var(--line);border-radius:7px;padding:9px 8px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:#FCFBF8;outline:none;
  }
  .item-row input:focus{border-color:var(--ink);}
  .item-remove{
    background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;
    padding:4px;line-height:1;
  }
  .item-remove:hover{color:var(--overdue);}
  .btn-add-item{
    background:none;border:1px dashed var(--line);border-radius:7px;color:var(--ink-soft);
    font-size:13px;padding:8px;cursor:pointer;width:100%;
  }
  .btn-add-item:hover{color:var(--ink);border-color:var(--ink-soft);}

  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{
    flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 16px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;
  }
  .search-row input:focus{border-color:var(--ink);}
  .btn-summary{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:9px 16px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .btn-summary:hover{color:var(--ink);}

  .summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .period-toggle{display:flex;gap:6px;}
  .period-btn{
    border:1px solid var(--line);background:#FCFBF8;border-radius:20px;
    padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  }
  .period-btn.active{background:var(--ink);color:#FBF9F4;border-color:var(--ink);}
  .summary-block{margin-bottom:18px;}
  .summary-block:last-child{margin-bottom:0;}
  .summary-block-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;font-weight:600;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);
  }
  .summary-block-head.order{color:var(--order);}
  .summary-block-head.purchase{color:var(--purchase);}
  .summary-items{display:flex;flex-direction:column;gap:6px;}
  .summary-item-row{
    display:flex;justify-content:space-between;font-size:13px;color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
  }
  .summary-empty{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .summary-unpaid{font-size:12px;color:var(--overdue);margin:0 0 8px;font-weight:600;}

  .calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0;}
  .cal-nav{
    background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;
    font-size:16px;color:var(--ink-soft);cursor:pointer;
  }
  .cal-nav:hover{color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);position:relative;
    border:1px solid transparent;
  }
  .cal-cell.empty{cursor:default;}
  .cal-cell:not(.empty):hover{background:#F0ECE3;}
  .cal-cell.today{border-color:var(--ink);font-weight:600;}
  .cal-cell.selected{background:var(--ink);color:#FBF9F4;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:#3D6FB4;position:absolute;bottom:6px;}
  .cal-cell.selected .cal-dot{background:#FBF9F4;}
  .cal-day-detail{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  .cal-day-label{font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;font-family:'IBM Plex Mono',monospace;}
  .cal-detail-item{
    display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;cursor:pointer;
    border-top:1px solid rgba(0,0,0,0.05);
  }
  .cal-detail-item:first-of-type{border-top:none;}
  .cal-detail-item:hover{color:var(--accent);}
  .cal-detail-tag{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cal-detail-tag.order{background:var(--order);}
  .cal-detail-tag.purchase{background:var(--purchase);}
  .cal-detail-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-empty-detail{font-size:12.5px;color:var(--ink-soft);}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .add-group{width:100%;}
    .btn-add{flex:1;}
    .item-row{grid-template-columns:1fr 60px 50px 24px;gap:4px;}
    .item-row input{padding:8px 6px;font-size:13px;}
    .search-row{flex-wrap:wrap;}
    .search-row input{width:100%;}
    .search-row .btn-summary{flex:1;}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <p class="login-title">🍅 番茄工作台</p>
    <p class="login-sub">登录后才能查看和修改订单</p>
    <div class="field full">
      <label>邮箱</label>
      <input type="email" id="login_email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field full">
      <label>密码</label>
      <input type="password" id="login_pass" placeholder="密码" autocomplete="current-password">
    </div>
    <p class="login-error" id="loginError"></p>
    <button class="btn-primary login-btn" id="loginBtn">登录</button>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">

  <div class="topbar">
    <div>
      <p class="title">工作台</p>
      <p class="subtitle" id="subtitle">正在加载记录…</p>
    </div>
    <div class="add-group">
      <button class="btn-add order" id="addOrderBtn">+ 客户订单</button>
      <button class="btn-add purchase" id="addPurchaseBtn">+ 采购进货</button>
      <button class="btn-logout" id="logoutBtn" title="退出登录">退出</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">全部记录</div></div>
    <div class="stat"><div class="num" id="statPending">0</div><div class="lbl">待处理</div></div>
    <div class="stat soon"><div class="num" id="statSoon">0</div><div class="lbl">3天内提醒</div></div>
    <div class="stat warn"><div class="num" id="statOverdue">0</div><div class="lbl">已逾期</div></div>
    <div class="stat warn"><div class="num" id="statUnpaid">0</div><div class="lbl">未付款</div></div>
  </div>

  <div id="priorityBox"></div>

  <div class="panel" id="addPanel">
    <p class="panel-title" id="panelTitle">新增记录</p>
    <div class="kind-toggle">
      <div class="kind-btn order" data-kind="order" id="kindOrderBtn">客户订单（有人来订购）</div>
      <div class="kind-btn purchase" data-kind="purchase" id="kindPurchaseBtn">采购进货（我去买货）</div>
    </div>
    <div class="form-grid">
      <div class="field full">
        <label id="lbl_name">商品明细</label>
        <div class="item-rows" id="itemRows"></div>
        <button type="button" class="btn-add-item" id="addItemRowBtn">+ 添加一样商品</button>
      </div>
      <div class="field">
        <label id="lbl_party">客户名称（选填）</label>
        <input type="text" id="f_party" placeholder="例如：陈小姐 / XX农场">
      </div>
      <div class="field">
        <label>金额（选填）</label>
        <input type="text" id="f_amount" placeholder="例如：RM280">
      </div>
      <div class="field">
        <label>付款状态</label>
        <div class="pay-toggle" id="payToggle">
          <div class="pay-btn unpaid active" data-paid="0">未付款</div>
          <div class="pay-btn paid" data-paid="1">已付款</div>
        </div>
      </div>
      <div class="field">
        <label id="lbl_date1">下单日期</label>
        <input type="date" id="f_date1">
      </div>
      <div class="field">
        <label id="lbl_date2">交货 / 取货日期（提醒）</label>
        <input type="date" id="f_date2">
      </div>
      <div class="field full">
        <label>备注（选填）</label>
        <textarea id="f_note" placeholder="联系方式、配送地址、特殊要求…"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="cancelAdd">取消</button>

<script>
window.addEventListener('error', function(e){
  const isGenericNoise = (e.message === 'Script error.' || !e.message) && !e.filename;
  if(isGenericNoise){
    console.error('（已忽略的无害提示）', e);
    return;
  }
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B4400C;color:#fff;padding:10px 16px;font-size:13px;z-index:9999;';
  box.textContent = '页面出错了：' + e.message + '（请截图这条消息发给我）';
  document.body.prepend(box);
});
window.addEventListener('unhandledrejection', function(e){
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B4400C;color:#fff;padding:10px 16px;font-size:13px;z-index:9999;';
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  box.textContent = '同步出错了：' + msg + '（请截图这条消息发给我）';
  document.body.prepend(box);
});

let records = [];
let filter = 'pending';
let editingId = null;
let currentKind = 'order';

const KIND_TEXT = {
  order: {
    label: '客户订单',
    nameLabel: '客户订购的商品明细',
    partyLabel: '客户名称（选填）',
    partyPlaceholder: '例如：陈小姐',
    date1Label: '下单日期',
    date2Label: '交货 / 取货日期（提醒）'
  },
  purchase: {
    label: '采购进货',
    nameLabel: '采购的商品明细',
    partyLabel: '供应商 / 平台（选填）',
    partyPlaceholder: '例如：XX农场 / 咖啡豆网店',
    date1Label: '买货日期',
    date2Label: '预计到货日期（提醒）'
  }
};

function uid(){ return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

let HAS_CLAUDE_STORAGE = false;
let HAS_LOCAL_STORAGE = false;
try{ HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null); }catch(e){}
try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); HAS_LOCAL_STORAGE = true; }catch(e){ HAS_LOCAL_STORAGE = false; }
let memoryFallback = [];

const firebaseConfig = {
  apiKey: "AIzaSyCDY5rXHyUG9p5OM9veSZqjUGPV0MvdHUE",
  authDomain: "organika-order-n-purchase-list.firebaseapp.com",
  projectId: "organika-order-n-purchase-list",
  storageBucket: "organika-order-n-purchase-list.firebasestorage.app",
  messagingSenderId: "963725004292",
  appId: "1:963725004292:web:b3a0b19bd7ffd3c8daef51"
};

let db = null;
let useFirestore = false;
let syncFailReason = '';
try{
  if(typeof firebase === 'undefined'){
    syncFailReason = '同步组件没能加载（可能是网络无法访问 gstatic.com，或被拦截/无网络）';
  }else{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    useFirestore = true;
  }
}catch(e){
  useFirestore = false;
  syncFailReason = 'Firebase 初始化出错：' + e.message;
  console.error('Firebase 初始化失败', e);
}

let firestoreReady = false;

let auth = null;
if(useFirestore){
  try{ auth = firebase.auth(); }catch(e){ console.error('Auth 初始化失败', e); }
}

function showApp(){
  const ls = document.getElementById('loginScreen');
  const aw = document.getElementById('appWrap');
  if(ls) ls.style.display = 'none';
  if(aw) aw.style.display = '';
}
function showLogin(){
  const ls = document.getElementById('loginScreen');
  const aw = document.getElementById('appWrap');
  if(ls) ls.style.display = 'flex';
  if(aw) aw.style.display = 'none';
}

function initAuthFlow(){
  if(!auth){
    showApp();
    loadRecordsLocal();
    return;
  }
  auth.onAuthStateChanged((user) => {
    if(user){
      showApp();
      if(!firestoreReady){
        migrateOldDataIfNeeded().then(() => initFirestoreSync());
      }
    }else{
      firestoreReady = false;
      showLogin();
    }
  });
}

function initFirestoreSync(){
  db.collection('tomato_shop_items').onSnapshot(
    (snap) => {
      try{
        records = snap.docs.map(d => d.data());
        firestoreReady = true;
        const sub = document.getElementById('subtitle');
        if(sub) sub.textContent = '☁️ 已连接同步 · 你和拍档共用一份数据';
        render();
      }catch(e){
        console.error('渲染同步数据时出错', e);
      }
    },
    (err) => {
      console.error('Firestore 同步失败', err);
      useFirestore = false;
      syncFailReason = '连接云端失败：' + (err.code || '') + ' ' + err.message;
      loadRecordsLocal();
    }
  );
}

async function migrateOldDataIfNeeded(){
  try{
    const check = await db.collection('tomato_shop_items').limit(1).get();
    if(!check.empty) return;
    const oldDoc = await db.collection('tomato_shop').doc('records').get();
    if(oldDoc.exists && Array.isArray(oldDoc.data().items) && oldDoc.data().items.length){
      const batch = db.batch();
      oldDoc.data().items.forEach(item => {
        if(!item.id) item.id = uid();
        batch.set(db.collection('tomato_shop_items').doc(item.id), item);
      });
      await batch.commit();
    }
  }catch(e){
    console.error('迁移旧数据失败', e);
  }
}

async function loadRecordsLocal(){
  try{
    if(HAS_CLAUDE_STORAGE){
      const res = await window.storage.get('records', false);
      records = res ? JSON.parse(res.value) : [];
    }else if(HAS_LOCAL_STORAGE){
      const raw = localStorage.getItem('tomato_records');
      records = raw ? JSON.parse(raw) : [];
    }else{
      records = memoryFallback;
    }
  }catch(e){
    records = [];
  }
  const sub = document.getElementById('subtitle');
  if(sub){
    sub.textContent = syncFailReason
      ? ('⚠️ ' + syncFailReason)
      : (HAS_LOCAL_STORAGE || HAS_CLAUDE_STORAGE
          ? '未连接云端，数据只存在本机（离线模式）'
          : '当前浏览器不支持本地保存，记录只在本次打开期间有效');
  }
  render();
}

async function loadRecords(){
  if(useFirestore){
    await migrateOldDataIfNeeded();
    initFirestoreSync();
    return;
  }
  loadRecordsLocal();
}

// 保存单条记录（新增/编辑/勾选/付款状态），云端模式下只写这一条，
// 避免两人同时操作时互相覆盖对方的改动
async function persistUpsert(record){
  if(useFirestore){
    try{
      await db.collection('tomato_shop_items').doc(record.id).set(record);
    }catch(e){
      console.error('保存到云端失败', e);
    }
    return;
  }
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set('records', JSON.stringify(records), false);
    }else if(HAS_LOCAL_STORAGE){
      localStorage.setItem('tomato_records', JSON.stringify(records));
    }else{
      memoryFallback = records;
    }
  }catch(e){
    console.error('保存失败', e);
  }
}

async function persistDelete(id){
  if(useFirestore){
    try{
      await db.collection('tomato_shop_items').doc(id).delete();
    }catch(e){
      console.error('删除失败', e);
    }
    return;
  }
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set('records', JSON.stringify(records), false);
    }else if(HAS_LOCAL_STORAGE){
      localStorage.setItem('tomato_records', JSON.stringify(records));
    }else{
      memoryFallback = records;
    }
  }catch(e){
    console.error('保存失败', e);
  }
}

async function saveRecords(){
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set('records', JSON.stringify(records), false);
    }else if(HAS_LOCAL_STORAGE){
      localStorage.setItem('tomato_records', JSON.stringify(records));
    }else{
      memoryFallback = records;
    }
  }catch(e){
    console.error('保存失败', e);
  }
}

function dayDiff(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function statusOf(r){
  if(r.done) return 'done';
  if(!r.date2) return 'normal';
  const d = dayDiff(r.date2);
  if(d < 0) return 'overdue';
  if(d <= 3) return 'soon';
  return 'normal';
}

function statusLabel(r){
  const s = statusOf(r);
  if(s === 'done') return '已完成';
  if(!r.date2) return '未设提醒';
  const d = dayDiff(r.date2);
  if(s === 'overdue') return `已逾期 ${Math.abs(d)} 天`;
  if(d === 0) return '今天';
  return `${d} 天后`;
}

function fmtDate(s){
  if(!s) return '未设置';
  const [y,m,d] = s.split('-');
  return `${y}.${m}.${d}`;
}

function renderStats(){
  const total = records.length;
  const pending = records.filter(r => !r.done).length;
  const soon = records.filter(r => statusOf(r) === 'soon').length;
  const overdue = records.filter(r => statusOf(r) === 'overdue').length;
  const unpaid = records.filter(r => !r.paid).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statSoon').textContent = soon;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statUnpaid').textContent = unpaid;
}

function renderPriority(){
  const box = document.getElementById('priorityBox');
  if(!box) return;

  const urgent = records.filter(r => {
    if(r.done || !r.date2) return false;
    const d = dayDiff(r.date2);
    return d <= 1;
  }).sort((a,b) => dayDiff(a.date2) - dayDiff(b.date2));

  if(urgent.length === 0){
    box.innerHTML = `
      <div class="priority calm">
        <div class="priority-head"><span class="dot"></span><span class="txt">当前没有紧急的单子</span></div>
        <div class="priority-calm-text">逾期、今天、明天要交的单子都会第一时间显示在这里。</div>
      </div>
    `;
    return;
  }

  const rows = urgent.map(r => {
    const d = dayDiff(r.date2);
    const t = KIND_TEXT[r.kind];
    let whenClass, whenText;
    if(d < 0){ whenClass = 'overdue'; whenText = `逾期${Math.abs(d)}天`; }
    else if(d === 0){ whenClass = 'today'; whenText = '今天'; }
    else { whenClass = 'tomorrow'; whenText = '明天'; }
    return `
      <div class="priority-item">
        <div class="p-chk" data-id="${r.id}"></div>
        <span class="p-name">${escapeHtml(r.name)}${r.party ? ' · ' + escapeHtml(r.party) : ''}</span>
        <span class="tag ${r.kind}">${t.label}</span>
        <span class="p-when ${whenClass}">${whenText}</span>
      </div>
    `;
  }).join('');

  box.innerHTML = `
    <div class="priority">
      <div class="priority-head"><span class="dot"></span><span class="txt">先处理这 ${urgent.length} 单</span></div>
      ${rows}
    </div>
  `;

  box.querySelectorAll('.p-chk').forEach(el => {
    el.addEventListener('click', () => toggleDone(el.dataset.id));
  });
}

function render(){
  try{
    renderInner();
  }catch(e){
    console.error('渲染出错，已忽略本次刷新', e);
  }
}

function renderInner(){
  renderStats();
  renderPriority();

  const calPanel = document.getElementById('calendarPanel');
  if(calPanel && calPanel.classList.contains('open')){
    renderCalendar();
    if(calSelectedDate) renderCalDayDetail(calSelectedDate);
  }

  let items = records.slice();

  if(filter === 'pending') items = items.filter(r => !r.done);
  else if(filter === 'done') items = items.filter(r => r.done);
  else if(filter === 'order') items = items.filter(r => r.kind === 'order' && !r.done);
  else if(filter === 'purchase') items = items.filter(r => r.kind === 'purchase' && !r.done);
  else if(filter === 'unpaid') items = items.filter(r => !r.paid);

  if(searchQuery){
    items = items.filter(r => {
      const hay = [r.name, r.party, r.note].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(searchQuery);
    });
  }

  items.sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const da = a.date2 || '9999-99-99';
    const db = b.date2 || '9999-99-99';
    return da.localeCompare(db);
  });

  const list = document.getElementById('list');
  list.innerHTML = '';

  if(items.length === 0){
    list.innerHTML = searchQuery
      ? `<div class="empty"><div class="big">没找到匹配的记录</div>换个关键词试试，或者清空搜索框看全部。</div>`
      : `<div class="empty"><div class="big">这里还空着</div>点右上角按钮，记一笔客户订单或采购进货。</div>`;
    return;
  }

  items.forEach(r => {
    const s = statusOf(r);
    const t = KIND_TEXT[r.kind];
    const card = document.createElement('div');
    card.className = 'card' + (s === 'overdue' ? ' overdue' : s === 'soon' ? ' soon' : '') + (r.done ? ' done' : '');

    card.innerHTML = `
      <div class="chk" data-id="${r.id}">${r.done ? '✓' : ''}</div>
      <div class="card-main">
        <div class="card-tagrow">
          <span class="tag ${r.kind}">${t.label}</span>
          ${r.party ? `<span class="card-party">${escapeHtml(r.party)}</span>` : ''}
          <span class="pay-badge ${r.paid ? 'paid' : 'unpaid'}" data-id="${r.id}">${r.paid ? '✓ 已付款' : '未付款'}</span>
        </div>
        ${cardItemsHtml(r)}
        <div class="card-meta">
          <span>${t.date1Label} ${fmtDate(r.date1)}</span>
          <span>${t.date2Label.replace('（提醒）','')} ${fmtDate(r.date2)}</span>
          ${r.amount ? `<span>${escapeHtml(r.amount)}</span>` : ''}
        </div>
        ${r.note ? `<div class="card-note">${escapeHtml(r.note)}</div>` : ''}
      </div>
      <div class="card-status ${s}">${statusLabel(r)}</div>
      <button class="card-edit" data-id="${r.id}" title="编辑">✎</button>
      <button class="card-del" data-id="${r.id}" title="删除">×</button>
    `;

    card.querySelector('.chk').addEventListener('click', () => toggleDone(r.id));
    card.querySelector('.pay-badge').addEventListener('click', () => togglePaid(r.id));
    card.querySelector('.card-edit').addEventListener('click', () => editRecord(r.id));
    card.querySelector('.card-del').addEventListener('click', () => deleteRecord(r.id));
    list.appendChild(card);
  });
}

function escapeAttr(v){
  return String(v == null ? '' : v).replace(/"/g,'&quot;');
}

function makeItemRow(name, qty, unit){
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="商品名称" value="${escapeAttr(name)}">
    <input type="number" class="item-qty" placeholder="数量" step="any" value="${escapeAttr(qty)}">
    <input type="text" class="item-unit" placeholder="单位" value="${escapeAttr(unit)}">
    <button type="button" class="item-remove" title="删除">×</button>
  `;
  row.querySelector('.item-remove').addEventListener('click', () => {
    const rows = document.querySelectorAll('#itemRows .item-row');
    if(rows.length > 1){
      row.remove();
    }else{
      row.querySelector('.item-name').value = '';
      row.querySelector('.item-qty').value = '';
      row.querySelector('.item-unit').value = '';
    }
  });
  return row;
}

function resetItemRows(items){
  const container = document.getElementById('itemRows');
  if(!container) return;
  container.innerHTML = '';
  const list = (items && items.length) ? items : [{name:'', qty:'', unit:''}];
  list.forEach(it => container.appendChild(makeItemRow(it.name, it.qty == null ? '' : it.qty, it.unit)));
}

function collectItems(){
  const rows = document.querySelectorAll('#itemRows .item-row');
  const items = [];
  rows.forEach(row => {
    const name = row.querySelector('.item-name').value.trim();
    const qtyRaw = row.querySelector('.item-qty').value.trim();
    const unit = row.querySelector('.item-unit').value.trim();
    if(name || qtyRaw){
      items.push({ name, qty: qtyRaw === '' ? null : Number(qtyRaw), unit });
    }
  });
  return items;
}

function itemsToText(items){
  if(!items || !items.length) return '';
  return items.map(it => {
    let s = it.name || '';
    if(it.qty !== null && it.qty !== undefined && it.qty !== '' && !isNaN(it.qty)){
      s += (s ? ' ' : '') + it.qty + (it.unit || '');
    }
    return s.trim();
  }).filter(Boolean).join('、');
}

function cardItemsHtml(r){
  if(r.items && r.items.length){
    const lines = r.items.map(it => {
      const hasQty = it.qty !== null && it.qty !== undefined && it.qty !== '' && !isNaN(it.qty);
      const qtyText = hasQty ? `${it.qty}${it.unit || ''}` : (it.unit || '');
      return `<div class="card-item-line"><span class="iname">${escapeHtml(it.name)}</span>${qtyText ? `<span class="iqty">${escapeHtml(qtyText)}</span>` : ''}</div>`;
    }).join('');
    return `<div class="card-items">${lines}</div>`;
  }
  return `<div class="card-top"><span class="card-name">${escapeHtml(r.name)}</span></div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function toggleDone(id){
  const r = records.find(x => x.id === id);
  if(r){ r.done = !r.done; persistUpsert(r); render(); }
}

function togglePaid(id){
  const r = records.find(x => x.id === id);
  if(r){ r.paid = !r.paid; persistUpsert(r); render(); }
}

function deleteRecord(id){
  records = records.filter(x => x.id !== id);
  persistDelete(id);
  render();
}

function setKind(kind){
  currentKind = kind;
  const t = KIND_TEXT[kind];
  document.getElementById('kindOrderBtn').classList.toggle('active', kind === 'order');
  document.getElementById('kindPurchaseBtn').classList.toggle('active', kind === 'purchase');
  document.getElementById('lbl_name').textContent = t.nameLabel;
  document.getElementById('lbl_party').textContent = t.partyLabel;
  document.getElementById('f_party').placeholder = t.partyPlaceholder;
  document.getElementById('lbl_date1').textContent = t.date1Label;
  document.getElementById('lbl_date2').textContent = t.date2Label;
}

let currentPaid = false;

function setPaidToggle(paid){
  currentPaid = paid;
  const box = document.getElementById('payToggle');
  if(!box) return;
  box.querySelectorAll('.pay-btn').forEach(btn => {
    btn.classList.toggle('active', (btn.dataset.paid === '1') === paid);
  });
}

function openPanel(kind){
  setKind(kind);
  document.getElementById('addPanel').classList.add('open');
  resetItemRows(null);
  setPaidToggle(false);
  const firstInput = document.querySelector('#itemRows .item-name');
  if(firstInput) firstInput.focus();
}
function closePanel(){
  document.getElementById('addPanel').classList.remove('open');
  editingId = null;
  document.getElementById('panelTitle').textContent = '新增记录';
  resetItemRows(null);
  setPaidToggle(false);
  document.getElementById('f_party').value = '';
  document.getElementById('f_amount').value = '';
  document.getElementById('f_date1').value = '';
  document.getElementById('f_date2').value = '';
  document.getElementById('f_note').value = '';
}

function editRecord(id){
  const r = records.find(x => x.id === id);
  if(!r) return;
  editingId = id;
  openPanel(r.kind);
  document.getElementById('panelTitle').textContent = '编辑记录';
  const items = (r.items && r.items.length) ? r.items : (r.name ? [{name: r.name, qty:'', unit:''}] : null);
  resetItemRows(items);
  setPaidToggle(!!r.paid);
  document.getElementById('f_party').value = r.party || '';
  document.getElementById('f_amount').value = r.amount || '';
  document.getElementById('f_date1').value = r.date1 || '';
  document.getElementById('f_date2').value = r.date2 || '';
  document.getElementById('f_note').value = r.note || '';
}

document.querySelectorAll('.pay-btn').forEach(btn => {

function closeSummaryPanel(){

let calViewDate = new Date();
calViewDate.setDate(1);
let calSelectedDate = null;

function closeCalendarPanel(){
  const p = document.getElementById('calendarPanel');
  if(p) p.classList.remove('open');
}

function renderCalendar(){
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  const titleEl = document.getElementById('calTitle');
  if(titleEl) titleEl.textContent = `${y}年${m+1}月`;
  const grid = document.getElementById('calGrid');
  if(!grid) return;
  grid.innerHTML = '';

  ['一','二','三','四','五','六','日'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = fmtYMD(new Date());
  const dateSet = new Set(records.filter(r => r.date2).map(r => r.date2));

  for(let i = 0; i < startOffset; i++){
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = fmtYMD(new Date(y, m, d));
    const el = document.createElement('div');
    el.className = 'cal-cell' + (dateStr === todayStr ? ' today' : '') + (dateStr === calSelectedDate ? ' selected' : '');
    el.innerHTML = String(d) + (dateSet.has(dateStr) ? '<span class="cal-dot"></span>' : '');
    el.addEventListener('click', () => {
      calSelectedDate = dateStr;
      renderCalendar();
      renderCalDayDetail(dateStr);
    });
    grid.appendChild(el);
  }
}

function renderCalDayDetail(dateStr){
  const box = document.getElementById('calDayDetail');
  if(!box) return;
  const dayRecords = records.filter(r => r.date2 === dateStr);
  if(dayRecords.length === 0){
    box.innerHTML = `<p class="cal-day-label">${dateStr}</p><p class="cal-empty-detail">这天还没有安排</p>`;
    return;
  }
  box.innerHTML = `<p class="cal-day-label">${dateStr} · 共 ${dayRecords.length} 单</p>` +
    dayRecords.map(r => `
      <div class="cal-detail-item" data-id="${r.id}">
        <span class="cal-detail-tag ${r.kind}"></span>
        <span class="cal-detail-text">${escapeHtml(r.name || '')}</span>
      </div>
    `).join('');
  box.querySelectorAll('.cal-detail-item').forEach(el => {
    el.addEventListener('click', () => {
      closeCalendarPanel();
      editRecord(el.dataset.id);
    });
  });
}

function periodRange(period){
  const now = new Date(); now.setHours(0,0,0,0);
  let start;
  if(period === 'week'){
    const day = now.getDay();
    const diffToMonday = (day === 0 ? 6 : day - 1);
    start = new Date(now); start.setDate(now.getDate() - diffToMonday);
  }else{
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return { start };
}

function fmtYMD(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function parseAmountNum(s){
  if(!s) return 0;
  const m = String(s).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}

function computeSummary(period){
  const { start } = periodRange(period);
  const startStr = fmtYMD(start);
  const todayStr = fmtYMD(new Date());
  const inRange = records.filter(r => r.date1 && r.date1 >= startStr && r.date1 <= todayStr);

  const result = { order: { total:0, unpaidTotal:0, count:0, items:{} }, purchase: { total:0, unpaidTotal:0, count:0, items:{} } };
  inRange.forEach(r => {
    const bucket = result[r.kind];
    if(!bucket) return;
    const amt = parseAmountNum(r.amount);
    bucket.total += amt;
    if(!r.paid) bucket.unpaidTotal += amt;
    bucket.count += 1;
    const items = (r.items && r.items.length) ? r.items : (r.name ? [{name: r.name, qty: null, unit: ''}] : []);
    items.forEach(it => {
      if(!it.name) return;
      const key = it.name + '|' + (it.unit || '');
      if(!bucket.items[key]) bucket.items[key] = { name: it.name, unit: it.unit || '', qty: 0, hasQty: false };
      if(it.qty !== null && it.qty !== undefined && it.qty !== '' && !isNaN(it.qty)){
        bucket.items[key].qty += Number(it.qty);
        bucket.items[key].hasQty = true;
      }
    });
  });
  return result;
}

function itemListHtml(bucket){
  const keys = Object.keys(bucket.items);
  if(keys.length === 0) return `<p class="summary-empty">这段时间还没有记录</p>`;
  return `<div class="summary-items">` + keys.map(k => {
    const it = bucket.items[k];
    const qtyText = it.hasQty ? `${it.qty}${it.unit}` : '未填数量';
    return `<div class="summary-item-row"><span>${escapeHtml(it.name)}</span><span>${escapeHtml(qtyText)}</span></div>`;
  }).join('') + `</div>`;
}

let currentSummaryPeriod = 'week';
function renderSummary(period){
  const data = computeSummary(period);
  const html = `
    <div class="summary-block">
      <div class="summary-block-head order"><span>客户订单</span><span>${data.order.count} 单 · RM${data.order.total.toFixed(0)}</span></div>
      ${data.order.unpaidTotal > 0 ? `<p class="summary-unpaid">未收款 RM${data.order.unpaidTotal.toFixed(0)}</p>` : ''}
      ${itemListHtml(data.order)}
    </div>
    <div class="summary-block">
      <div class="summary-block-head purchase"><span>采购进货</span><span>${data.purchase.count} 单 · RM${data.purchase.total.toFixed(0)}</span></div>
      ${data.purchase.unpaidTotal > 0 ? `<p class="summary-unpaid">未付款 RM${data.purchase.unpaidTotal.toFixed(0)}</p>` : ''}
      ${itemListHtml(data.purchase)}
    </div>
  `;
  document.getElementById('summaryContent').innerHTML = html;
}

function loginErrorText(code){
  const map = {
    'auth/invalid-email': '邮箱格式不对',
    'auth/user-not-found': '账号不存在',
    'auth/wrong-password': '密码错误',
    'auth/invalid-credential': '邮箱或密码不对',
    'auth/too-many-requests': '尝试次数太多，请稍后再试'
  };
  return map[code] || ('登录失败：' + code);
}

async function doLogin(){
  const email = document.getElementById('login_email').value.trim();
  const pass = document.getElementById('login_pass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = '请输入邮箱和密码'; return; }
  if(!auth){ errEl.textContent = '同步服务不可用，暂时无法登录'; return; }
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errEl.textContent = loginErrorText(e.code);
  }
}

on('loginBtn', 'click', doLogin);
on('login_pass', 'keydown', (e) => { if(e.key === 'Enter') doLogin(); });
on('logoutBtn', 'click', () => { if(auth) auth.signOut(); });

on('saveAdd', 'click', async () => {
  const items = collectItems();
  if(items.length === 0){
    const firstInput = document.querySelector('#itemRows .item-name');
    if(firstInput) firstInput.focus();
    return;
  }
  const name = itemsToText(items);
  const record = {
    id: editingId || uid(),
    kind: currentKind,
    name,
    items,
    party: document.getElementById('f_party').value.trim(),
    amount: document.getElementById('f_amount').value.trim(),
    paid: currentPaid,
    date1: document.getElementById('f_date1').value,
    date2: document.getElementById('f_date2').value,
    note: document.getElementById('f_note').value.trim(),
    done: false
  };
  const wasEditing = !!editingId;
  if(editingId){
    const idx = records.findIndex(x => x.id === editingId);
    if(idx > -1){
      record.done = records[idx].done;
      records[idx] = record;
    }
  }else{
    records.push(record);
  }
  await persistUpsert(record);
  closePanel();
  if(!wasEditing){
    filter = 'pending';
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.f === 'pending'));
  }
  render();
});

  });
});
